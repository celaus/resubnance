<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{name}}</title>
    <link rel="icon" type="image/svg+xml" href="{{baseUrl}}/favicon.svg" />
    <link rel="stylesheet" type="text/css" href="/style.css" />
</head>

<body id="appBody">
    <header>
        <a class="wordmark" href="/"><span class="wordmark-logo">&#9654;</span>{{name}}</a>
        <nav class="header-nav">
            <a href="/cache">cache</a>
            <a href="/schema/request">request schema</a>
            <a href="/schema/response">response schema</a>
            <a href="https://github.com/celaus/resubnance" target="_blank">github</a>
            <span class="version">{{version}}</span>
        </nav>
    </header>

    <main class="app">
        <!-- Search -->
        <section class="panel search-panel">
            <h2 class="panel-title">Search</h2>
            <div class="search-row">
                <input type="text" id="searchInput" class="search-input" placeholder="Search tracks…"
                    autocomplete="off" spellcheck="false" />
                <button class="btn" id="searchBtn" onclick="doSearch()">Search</button>
            </div>
            <ul class="search-results" id="searchResults">
                <li class="status-msg">…</li>
            </ul>
        </section>

        <!-- Playlists -->
        <section class="panel">
            <h2 class="panel-title">Playlists</h2>
            <ul class="playlists-list" id="playlistsList">
                <li class="status-msg">
                    <span class="spinner"></span>Loading playlists…
                </li>
            </ul>
            <button class="btn btn-sm align-end" onclick="loadPlaylists()">Refresh</button>
        </section>

        <!-- Queue -->
        <section class="panel" id="queuePanel">
            <div class="queue-header">
                <h2 class="panel-title">Queue</h2>
                <button class="btn btn-sm" onclick="clearQueue()">Clear</button>
            </div>
            <div id="queueTracks" class="queue-tracks">
                <p class="status-msg">Queue is empty.</p>
            </div>
        </section>
    </main>

    <!-- Player bar -->
    <div class="player-bar">
        <div class="player-progress"><div class="progress-fill" id="progressFill"></div></div>
        <div class="player-now-playing">
            <div class="player-line">
                <div class="player-track-title" id="playerTitle">&#8212; standby &#8212;</div>
                <div class="player-times">
                    <span id="elapsedTime">0:00</span> / <span id="totalTime">&#8211;:&#8211;&#8211;</span>
                </div>
            </div>
            <div class="player-track-artist" id="playerArtist"></div>
        </div>
        <div class="player-controls">
            <button class="ctrl-btn ctrl-btn-play" id="playPauseBtn" onclick="togglePlayPause()" title="Play / pause">&#9654;</button>
            <button class="ctrl-btn" onclick="skipNext()" title="Next track">&#9197;</button>
            <button class="ctrl-btn" id="stopBtn" onclick="stopPlayback()" title="Stop">&#9632;</button>
        </div>
        <div class="player-volume">
            <span class="volume-icon" aria-hidden="true">
                <svg viewBox="0 0 16 16" fill="currentColor">
                    <path d="M2.5 6h2.4L8.5 3v10L4.9 10H2.5z" />
                    <path d="M10.2 5.4c1.4 1.6 1.4 3.6 0 5.2" fill="none" stroke="currentColor"
                        stroke-width="1.3" stroke-linecap="round" />
                    <path d="M12 3.6c2.3 2.6 2.3 6.2 0 8.8" fill="none" stroke="currentColor"
                        stroke-width="1.3" stroke-linecap="round" />
                </svg>
            </span>
            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100"
                oninput="onVolumeChange(this.value)" onchange="onVolumeCommit(this.value)" />
            <span class="volume-value" id="volumeValue">100%</span>
        </div>
    </div>

    <div id="toast"></div>

    <script>
        window.WS_URL = "{{baseUrl}}/ws";
    </script>

    <script src="/handlers.js"></script>
</body>

</html>
