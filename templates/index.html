<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{name}}</title>
    <link rel="icon" type="image/svg+xml" href="{{baseUrl}}/favicon.svg" />
    <link rel="stylesheet" type="text/css" href="/style.css" />
</head>

<body>
    <header>
        <a class="wordmark" href="/"><span class="wordmark-logo">&#9654;</span>{{name}}</a>
        <nav class="header-nav">
            <a href="/cache">cache</a>
            <a href="/schema/request">request schema</a>
            <a href="/schema/response">response schema</a>
            <a href="https://github.com/celaus/resubnance" target="_blank">github</a>
            <span class="version">{{version}}</span>
        </nav>
    </header>

    <main class="app">
        <!-- Player -->
        <section class="panel player-panel">
            <div class="player-cover" aria-hidden="true">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="coverGradient" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0" stop-color="#232323" />
                            <stop offset="1" stop-color="#0f0f0f" />
                        </linearGradient>
                    </defs>
                    <rect width="100" height="100" fill="url(#coverGradient)" />
                    <path d="M70 22v38a11 11 0 1 1-4-8.6V31l-24 6v32a11 11 0 1 1-4-8.6V27z" fill="#1ed760" opacity="0.85" />
                </svg>
            </div>
            <div class="player-side">
                <div class="player-now-playing">
                    <div class="player-track-title" id="playerTitle">not playing</div>
                    <div class="player-track-artist" id="playerArtist"></div>
                </div>
                <div class="player-controls">
                    <button class="ctrl-btn ctrl-btn-play" id="playPauseBtn" title="Play / pause" aria-label="Play">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="skipBtn" title="Next track" aria-label="Next track">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
                        </svg>
                    </button>
                    <button class="ctrl-btn" id="stopBtn" title="Stop" aria-label="Stop">
                        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M6 6h12v12H6z" />
                        </svg>
                    </button>
                </div>
                <div class="player-volume">
                    <span class="volume-icon" aria-hidden="true">
                        <svg viewBox="0 0 16 16" fill="currentColor">
                            <path d="M2.5 6h2.4L8.5 3v10L4.9 10H2.5z" />
                            <path d="M10.2 5.4c1.4 1.6 1.4 3.6 0 5.2" fill="none" stroke="currentColor"
                                stroke-width="1.3" stroke-linecap="round" />
                            <path d="M12 3.6c2.3 2.6 2.3 6.2 0 8.8" fill="none" stroke="currentColor"
                                stroke-width="1.3" stroke-linecap="round" />
                        </svg>
                    </span>
                    <input type="range" class="volume-slider" id="volumeSlider" min="0" max="100" value="100" />
                    <span class="volume-value" id="volumeValue">100%</span>
                </div>
                <div class="player-times">
                    <span id="elapsedTime">0:00</span> / <span id="totalTime">–:––</span>
                </div>
            </div>
            <div class="player-progress"><div class="progress-fill" id="progressFill"></div></div>
        </section>

        <!-- Search + Queue -->
        <section class="queue-wrap">
            <input type="text" id="searchInput" class="queue-search" placeholder="Search tracks…"
                autocomplete="off" spellcheck="false" />
            <div class="queue-body">
                <section class="panel" id="queuePanel">
                    <div class="queue-header">
                        <h2 class="panel-title">Queue</h2>
                        <button class="btn btn-sm" id="queueClearBtn">Clear</button>
                    </div>
                    <div id="queueTracks" class="queue-tracks">
                        <p class="status-msg">Queue is empty.</p>
                    </div>
                </section>
                <ul class="search-results" id="searchResults">
                    <li class="status-msg">…</li>
                </ul>
            </div>
        </section>
    </main>

    <div id="toast"></div>

    <script>
        window.WS_URL = "{{baseUrl}}/ws";
    </script>

    <script src="/handlers.js"></script>
</body>

</html>
