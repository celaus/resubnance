[package]
name = "resubnance"
version = "0.6.0"
edition = "2024"
license-file = "LICENSE"

[[bin]]
name = "resubnance-server"
path = "src/bin/server.rs"

[lib]
name = "resubnance"
path = "src/lib.rs"

[dependencies]
axum = { version = "*", features = [
    "ws",
    "http1",
    "tracing",
    "tower-log",
    "matched-path"
], default-features = false }
rodio = { git = "https://github.com/RustAudio/rodio.git", features = [
    "tracing",
    "playback",
    "symphonia-all",
], default-features = false }
sunk = { git = "https://github.com/celaus/sunk", branch = "update-reqwest", features = [
    "rustls",
] }
reqwest = { version = "0.13.4", features = [
    "rustls",
    "blocking",
    "multipart",
], default-features = false }
# poem = { version = "3", default-features = false, features = [
#     "rustls",
#     "websocket",
#     "static-files",
# ] }
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "fs",
    "sync",
] }
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1", features = ["v4"] }
futures = "0.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
tera = "1"
lazy_static = "*"
figment = { version = "0.10", features = ["toml", "env"] }
toml = "0.8"
thiserror = "2"
url = { version = "2", features = ["serde"] }
serde_with = { version = "3", features = ["macros"] }
arc-swap = "1"
schemars = "1"
tower-http = {version = "0.6", features = ["fs", "trace"], default-features = false}
http = "1.4"

[patch.crates-io]
# https://github.com/RustAudio/cpal/issues/1134 (not yet released to rodio)
cpal = { git = "https://github.com/RustAudio/cpal" }

[dev-dependencies]
tokio-tungstenite = "0.27"
http = "1"
